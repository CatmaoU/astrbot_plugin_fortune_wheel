name: astrbot_plugin_fortune_wheel
display_name: 大礼包轮盘
version: v1.0.6
author: iMuli
category: 娱乐
short_desc: /大礼包 弹出轮盘随机禁言，支持投票解禁、诅咒转移、求饶系统
desc: |
    抽奖禁言插件：/大礼包 弹出动态轮盘随机禁言！
    
    功能特性：
    - 轮盘抽奖：/大礼包 弹出动态轮盘，按权重随机抽取禁言时长
    - 自定义范围：/大礼包 5-30 指定禁言区间
    - 投票解禁：普通用户发起解禁投票，群友 /同意 /不同意 表决
    - 诅咒系统：设置诅咒，下次抽奖触发权重加成；可转移给他人，失败则反弹
    - 求饶系统：私聊机器人尝试解除禁言，每次递增成功率
    - 缓存管理：自动刷新禁言列表，支持手动 /刷新缓存
    - 高度可配置：所有关键参数均可在配置文件中调整
repo: https://github.com/CatmaoU/astrbot_plugin_fortune_wheel
homepage: https://github.com/CatmaoU/astrbot_plugin_fortune_wheel
astrbot_version: ">=4.26.0"
support_platforms:
  - aiocqhttp
tags:
  - 轮盘
  - 抽奖
  - 禁言
  - 投票
  - 诅咒
  - 管理
